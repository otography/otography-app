packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@cloudflare/oxlint-config": ^0.1.0
  "@cloudflare/vite-plugin": 2.0.0-rc.2
  "@fontsource-variable/bricolage-grotesque": ^5.3.0
  "@fontsource-variable/figtree": ^5.3.0
  "@fontsource/zen-kaku-gothic-new": ^5.3.1
  "@hono/zod-validator": ^0.9.1
  "@libsql/client": ^0.18.0
  "@stylexjs/eslint-plugin": ^0.19.2
  "@stylexjs/stylex": ^0.19.2
  "@stylexjs/unplugin": ^0.19.2
  "@types/node": ^24
  "@ui-sdk/core": 0.1.0-beta.10
  "@ui-sdk/react": 0.1.0-beta.10
  budoux: ^0.8.4
  drizzle-kit: 1.0.0-rc.5
  drizzle-orm: 1.0.0-rc.5
  errore: ^0.14.1
  knip: ^6.45.1
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
overrides:
  typescript: "catalog:"
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  lightningcss: true
  workerd: true
minimumReleaseAgeExclude:
  - "@cloudflare/build-output-utils@1.0.0-rc.2"
  - "@cloudflare/config@1.0.0-rc.2"
  - "@cloudflare/runtime-types@0.1.31"
  - "@cloudflare/vite-plugin@2.0.0-rc.2"
  - cf@1.0.0-rc.2
  - miniflare@5.20261118.0-beta
  - "@cloudflare/oxlint-config@0.1.0"
