packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@libsql/client": ^0.18.0
  "@types/node": ^24
  drizzle-kit: 1.0.0-rc.5
  drizzle-orm: 1.0.0-rc.5
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  lightningcss: true
  workerd: true
