packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@fontsource-variable/bricolage-grotesque": ^5.3.0
  "@fontsource-variable/figtree": ^5.3.0
  "@fontsource/zen-kaku-gothic-new": ^5.3.1
  "@hono/zod-validator": ^0.9.1
  "@libsql/client": ^0.18.0
  "@stylexjs/eslint-plugin": ^0.19.2
  "@stylexjs/stylex": ^0.19.2
  "@stylexjs/unplugin": ^0.19.2
  "@types/node": ^24
  budoux: ^0.8.4
  drizzle-kit: 1.0.0-rc.5
  drizzle-orm: 1.0.0-rc.5
  errore: ^0.14.1
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  lightningcss: true
  workerd: true
