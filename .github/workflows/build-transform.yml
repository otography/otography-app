# 変換 A（2048 → 256 次元）を作って評価し、Turso に入れる（apps/api/scripts/build-transform.ts）。
# 手動で実行する。公式アカウントの感想の x（D1）から作るので、先に Embed posts を実行しておく。Workers AI は使わない。
name: Build embedding transform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 対象
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    concurrency:
      group: embedding-${{ inputs.environment || 'production' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      - run: vp run api#embedding:build-transform
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKERS_AI_API_TOKEN: ${{ secrets.WORKERS_AI_API_TOKEN }}
          # apps/api/cloudflare.config.ts の X_STORE と同じ名前
          X_STORE_NAME: ${{ (inputs.environment || 'production') == 'staging' && 'x-store-staging-01' || 'x-store-01' }}
