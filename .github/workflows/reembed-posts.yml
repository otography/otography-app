# 本文を直した投稿の埋め込みを作り直す（apps/api/scripts/reembed-posts.ts）。
# 公式アカウントの感想の本文を直したときに、Import official reviews が出力した ID を post_ids に渡して手動で実行する。
name: Reembed posts

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 対象
        type: choice
        options: [staging, production]
        required: true
      post_ids:
        description: 投稿の ID（カンマ区切り）
        type: string
        required: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: embedding-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      - run: vp run api#embedding:reembed-posts
        env:
          POST_IDS: ${{ inputs.post_ids }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKERS_AI_API_TOKEN: ${{ secrets.WORKERS_AI_API_TOKEN }}
          # apps/api/cloudflare.config.ts の X_STORE と同じ名前
          X_STORE_NAME: ${{ inputs.environment == 'staging' && 'x-store-staging-01' || 'x-store-01' }}
