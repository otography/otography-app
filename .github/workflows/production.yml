# main へのマージ（push）で、変更を本番（Worker「app」と本番の Turso）に反映する。
# 理由は docs/adr/0015-deploy-from-github-actions.md を参照。
name: Production

on:
  push:
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true

      - run: vp check
      - run: vp test

      - name: Migrate the production database
        run: vp run db#db:migrate
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Deploy to production
        run: |
          vp run api#deploy 2>&1 | tee deploy.log
          # CI では、確認が必要な操作を cf が中断し、終了コード 0 で終わる。完了の表示がなければ失敗にする。
          if ! grep -q "Deploy complete" deploy.log; then
            echo "::error::本番へのデプロイが完了しませんでした。deploy.log を確認してください"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
