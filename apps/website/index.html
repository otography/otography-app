<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Music is passed on in words." />
    <title>otography</title>
    <!-- どの CSS より先にレイヤー順と最小リセットを宣言し、後から来る ui-sdk や StyleX が上書きできるようにする。 -->
    <style>
      @layer base-reset, ui-sdk;

      @font-face {
        font-family: "Geist Mono";
        src: url("/fonts/GeistMonoVF.woff") format("woff");
        font-weight: 100 900;
        font-display: swap;
      }

      @layer base-reset {
        *,
        *::before,
        *::after {
          box-sizing: border-box;
        }

        html,
        body,
        #app {
          min-height: 100%;
        }

        body {
          margin: 0;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
